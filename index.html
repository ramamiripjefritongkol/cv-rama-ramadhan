<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Rama Ramadhan</title>
    <!-- Menggunakan Google Fonts Poppins agar tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Pengaturan Dasar & Variabel Warna Pink */
        :root {
            --pink-dark: #d81b60;
            --pink-primary: #ec407a;
            --pink-medium: #f48fb1;
            --pink-light: #fce4ec;
            --pink-bg: #fff0f5;
            --text-dark: #333333;
            --text-muted: #666666;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--pink-light) 0%, #f8bbd0 100%);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kontainer Utama CV */
        .cv-container {
            max-width: 900px;
            width: 100%;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.18);
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr;
        }

        /* Bagian Kiri (Sidebar Pink) */
        .sidebar {
            background: linear-gradient(180deg, var(--pink-dark) 0%, var(--pink-primary) 100%);
            color: var(--white);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar / Foto Profil Dummy */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--pink-light);
            border: 5px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .profile-img i {
            font-size: 70px;
            color: var(--pink-dark);
        }

        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .badge-role {

            padding: 5px 15px;
